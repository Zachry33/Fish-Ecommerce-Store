<!DOCTYPE html>
<html lang = "en">

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fish Store</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/cart.js"></script>
    </head>

    <body class="d-flex flex-column min-vh-100>
        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg py-4" style="background-color: #a5c7de;" data-bs-theme="light">
                <div class="container-fluid d-flex align-items-center justify-content-between">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="navbar-brand" href="#"></a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html"><img src="images/logo.jpg" alt="Logo" width="70" height="55" class="d-inline-block align-text-top">
                        </a></li>
                    </ul>
                    <form class="d-flex mx-auto" role="search" id="navsearchbar">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                        <button id="search-button" class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="login.html">Login / Signup</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html"><i class="bi bi-cart"></i></a>
                        </li>
                    </ul>
                </div>
                <div>
            </nav>
            <nav class="navbar navbar-expand-lg navbar-light secondary-nav" style="background-color: #d9ecf7;">
                <div class="container justify-content-center">
                <ul class="navbar-nav">
                </ul>
                </div>
            </nav>
        </nav>
        <div class="p-5">
            <h1>Your Cart</h1>
            <table class="table table-striped" id="cart-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="cart-body"></tbody>
            </table>
        

            <h3 class="mt-4">Grand Total: $<span id="grand-total">0</span></h3>

            <button id="open-checkout" 
            class="btn btn-success" 
            data-bs-toggle="modal" 
            data-bs-target="#checkoutModal">
            Proceed to Checkout
            </button>


        <!-- Checkout Modal -->
        <div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Checkout</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- Order Summary -->
                <h6 class="mb-3">Order Summary</h6>
                <ul class="list-group mb-3" id="checkout-list">
                </ul>

                <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between">
                    Subtotal <span id="checkout-subtotal">$0.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    Tax (13%) <span id="checkout-tax">$0.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold">
                    Total <span id="checkout-total">$0.00</span>
                </li>
                </ul>

                <hr>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="place-order-btn">Place Order</button>
            </div>

            </div>
        </div>
        </div>
        </div>
        </div>
        <footer class="mt-auto">
            <div class="container-fluid ps-5 pt-3 pb-3 bg-secondary">
                <h3>Contact Us</h3>
                <p>Phone: 555-555-4155</p>
                <p>Email: fishstore@fishmail.com</p>
            </div>
        </footer>
    </body>
</html>
