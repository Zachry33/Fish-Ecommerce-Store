<!DOCTYPE html>
<html lang = "en">

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Fish Store</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/addition.js"></script>
    </head>

    <body>
        <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-4">
            <div class="card shadow-sm signup-card">
            <div class="card-body">
                <h3 class="text-center mb-3">Add a Product</h3>

                <form id="productForm">
                
                <div class="mb-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" placeholder="Enter Title">
                </div>

                
                <div class="mb-4">
                    <label for="des" class="form-label">Description</label>
                    <input type="text" class="form-control" id="des" placeholder="Enter Description">
                </div>

                
                <div class="mb-4">
                    <label for="img-url" class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="img-url" placeholder="Enter URL">
                </div>

                <div class="mb-4">
                    <label for="price" class="form-label">Price</label>
                    <input type="text" class="form-control" id="price" placeholder="Enter Price">
                </div>

                <div class="mb-4">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="text" class="form-control" id="stock" placeholder="Enter Stock">
                </div>

                <!-- Login button -->
                <button type="submit" class="btn btn-primary w-100">Add Product</button>
                </form>

            </div>
            </div>
        </div>
        </div>
    </body>
</html>
